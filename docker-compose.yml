name: ${COMPOSE_PROJECT_NAME:-data-ai-explorer}

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace/backend
      - ./data:/workspace/data:ro
    environment:
      PYTHONUNBUFFERED: "1"
      DATASET_ALLOWED_ROOTS: ${DATASET_ALLOWED_ROOTS:-/workspace/data}
      DATASET_STORAGE_DIR: ${DATASET_STORAGE_DIR:-/tmp/aegis-datasets}
      TIDB_MCP_ENDPOINT: ${TIDB_MCP_ENDPOINT:-}
      TIDB_MCP_ALLOWED_HOSTS: ${TIDB_MCP_ALLOWED_HOSTS:-}
      CHATBI_ALLOW_PRIVATE_HOSTS: ${CHATBI_ALLOW_PRIVATE_HOSTS:-true}
      CHATBI_ALLOWED_DB_HOSTS: ${CHATBI_ALLOWED_DB_HOSTS:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      MODEL_GATEWAY_MODEL: ${MODEL_GATEWAY_MODEL:-}
      MODEL_ALLOW_PRIVATE_HOSTS: ${MODEL_ALLOW_PRIVATE_HOSTS:-true}
      MODEL_ALLOWED_HOSTS: ${MODEL_ALLOWED_HOSTS:-}
      CORS_ALLOW_LOCALHOST: ${CORS_ALLOW_LOCALHOST:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AEGIS_PLATFORM_DB_HOST: ${AEGIS_PLATFORM_DB_HOST:-tidb}
      AEGIS_PLATFORM_DB_PORT: ${AEGIS_PLATFORM_DB_PORT:-4000}
      AEGIS_PLATFORM_DB_USER: ${AEGIS_PLATFORM_DB_USER:-root}
      AEGIS_PLATFORM_DB_PASSWORD: ${AEGIS_PLATFORM_DB_PASSWORD:-}
      AEGIS_PLATFORM_DB_DATABASE: ${AEGIS_PLATFORM_DB_DATABASE:-aegis_platform}
      TIDB_HOST: ${TIDB_HOST:-tidb}
      TIDB_PORT: ${TIDB_PORT:-4000}
      TIDB_USER: ${TIDB_USER:-root}
      TIDB_PASSWORD: ${TIDB_PASSWORD:-}
      TIDB_DATABASE: ${TIDB_DATABASE:-aegis_demo}
    depends_on:
      tidb:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    depends_on:
      backend:
        condition: service_started
      tidb:
        condition: service_healthy
      redis:
        condition: service_healthy

  tidb:
    image: ${TIDB_IMAGE:-pingcap/tidb:v8.5.2}
    command: ["--store=mocktikv", "--path=/var/lib/tidb"]
    ports:
      - "${TIDB_PORT:-4000}:4000"
      - "${TIDB_STATUS_PORT:-10080}:10080"
    volumes:
      - tidb_data:/var/lib/tidb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10080/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  web_node_modules:
  tidb_data:
  redis_data:
  minio_data:
